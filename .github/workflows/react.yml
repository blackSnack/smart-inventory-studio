name: React preview
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-react:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/design-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-design-evidence
          path: design-evidence/*.jpg
          if-no-files-found: warn
      - run: python tests/react-smoke.py
      - run: python tests/mobile-layout.py
      - run: python tests/live-read-smoke.py
      - run: python tests/update-smoke.py
