name: Resolve design dependencies
on:
  push:
    branches: [fix/studio-ui-consistency]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web install --save-exact --ignore-scripts --no-audit --no-fund @fontsource-variable/geist@5.3.0 reicon-react@1.2.6
      - name: Record verified dependency and icon metadata
        run: |
          cd web
          node --input-type=module -e "import fs from 'node:fs'; import * as R from 'reicon-react';const p=JSON.parse(fs.readFileSync('package-lock.json','utf8'));console.log('DESIGN_LOCK_DELTA='+JSON.stringify(Object.fromEntries(Object.entries(p.packages).filter(([k])=>k.includes('reicon')||k.includes('geist')))));console.log('DESIGN_ICONS='+JSON.stringify(Object.keys(R).filter(k=>/^(Home|Camera|Image|File|Arrow|Chevron|Close|X|Plus|Add|Search|Keyboard|Grid|Box|Package|Warehouse|Setting)/i.test(k))));"
