name: Gateway CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build shared TypeScript core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:core
      - name: Linux synthetic Gateway smoke
        if: runner.os == 'Linux'
        run: npm --prefix gateway test
      - name: Windows synthetic Gateway smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl)) { throw 'Git for Windows OpenSSL prerequisite unavailable' }
          $env:GATEWAY_TEST_OPENSSL = $openssl
          npm --prefix gateway test
      - name: Build and install-test Windows x64 package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'GatewayPackage'
          & ./gateway/scripts/Build-WindowsPackage.ps1 -OutputDirectory $out
          if (-not (Test-Path -LiteralPath (Join-Path $out 'SmartInventoryGateway.zip'))) { throw 'Windows package archive was not produced' }
          $powershell = (Get-Command powershell.exe).Source
          & $powershell -NoProfile -ExecutionPolicy Bypass -File ./gateway/tests/windows-package-smoke.ps1 -PackageDirectory (Join-Path $out 'SmartInventoryGateway') -Workspace (Join-Path $env:RUNNER_TEMP 'GatewayPackageSmoke')
          if ($LASTEXITCODE -ne 0) { throw 'Windows package install/upgrade/uninstall smoke failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: smart-inventory-gateway-windows-x64
          path: |
            ${{ runner.temp }}/GatewayPackage/SmartInventoryGateway.zip
            ${{ runner.temp }}/GatewayPackage/SmartInventoryGateway.zip.sha256
          if-no-files-found: error
          retention-days: 30
