name: Publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan immutable version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/studio-releases.json
          node web/scripts/release-plan.mjs /tmp/studio-releases.json
          tag=$(node -p "'v'+require('./web/package.json').version")
          existing=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$existing" ] && ! grep -q "^$GITHUB_SHA[[:space:]]" <<< "$existing"; then
            if ! grep -Fxq 'publish=false' "$GITHUB_OUTPUT"; then echo 'Tag points to another commit'; exit 1; fi
          fi
  build:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui-smoke.py
      - run: python tests/journal-browser.py
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web run build
      - run: python tests/react-smoke.py
      - run: python tests/mobile-layout.py
      - run: python tests/live-read-smoke.py
      - run: python tests/update-smoke.py
      - name: Package exact static release
        run: |
          mkdir -p release-package
          tag=$(node -p "'v'+require('./web/package.json').version")
          python -c 'import shutil,sys; shutil.make_archive(sys.argv[1],"zip","web/dist")' "release-package/smart-inventory-studio-$tag"
          (cd release-package && sha256sum *.zip > SHA256SUMS)
          node -e "const h=require('./web/release-history.json')[0];require('fs').writeFileSync('release-package/RELEASE-NOTES.md','# '+h.title+'\\n\\n'+h.changes.map(s=>'- '+s).join('\\n')+'\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-package
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp index.html _site/index.html && touch _site/.nojekyll && mkdir -p _site/react-preview && cp -R web/dist/. _site/react-preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy release preview
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: [plan, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package
      - name: Verify published manifest
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "${SITE%/}/react-preview/version.json?commit=$GITHUB_SHA&attempt=$attempt" -o /tmp/studio-version.json && python -c 'import json,os; m=json.load(open("/tmp/studio-version.json")); assert "v"+m["version"]==os.environ["TAG"] and m["commit"]==os.environ["GITHUB_SHA"]'; then
              if curl -fsS --max-time 10 "${SITE%/}/react-preview/?commit=$GITHUB_SHA&attempt=$attempt" -o /tmp/studio-index.html && curl -fsS --max-time 10 "${SITE%/}/react-preview/sw.js?commit=$GITHUB_SHA&attempt=$attempt" -o /tmp/studio-sw.js && python -c 'import glob,zipfile,pathlib; z=zipfile.ZipFile(glob.glob("release-package/*.zip")[0]); assert z.read("index.html")==pathlib.Path("/tmp/studio-index.html").read_bytes() and z.read("sw.js")==pathlib.Path("/tmp/studio-sw.js").read_bytes()'; then exit 0; fi
            fi
            sleep 5
          done
          exit 1
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release create "$TAG" release-package/*.zip release-package/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Smart Inventory Studio $TAG" --notes-file release-package/RELEASE-NOTES.md --prerelease
