name: Publish demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/ui-smoke.py
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web run build
      - run: python tests/react-smoke.py
      - run: python tests/live-read-smoke.py
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp index.html _site/index.html && touch _site/.nojekyll && mkdir -p _site/react-preview && cp -R web/dist/. _site/react-preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
