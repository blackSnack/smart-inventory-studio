const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let data;try{data=JSON.parse(localStorage.getItem('studio-demo-v1'))||structuredClone(initial)}catch{data=structuredClone(initial)}let route='home',cabId='A',cellId='',layer=0,query='',cat='全部',draft=null,photoURL='',selection=[];const navs=[['home','首页'],['part','元件'],['storage','仓储'],['settings','设置']];const qty=p=>Object.values(p.stock).reduce((a,b)=>a+b,0),occupied=id=>data.parts.filter(p=>p.stock[id]>0),save=()=>{try{localStorage.setItem('studio-demo-v1',JSON.stringify(data))}catch{}};
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),2200)}function go(r){route=r;render();window.scrollTo(0,0)}function nav(){for(const id of ['nav','bottom'])$('#'+id).innerHTML=navs.map(([r,t])=>`<button class="${route===r?'active':''}" onclick="go('${r}')">${icon(r)}<span>${t}</span></button>`).join('')};const header=(t,s='')=>`<header class="top"><div><div class="eyebrow">STUDIO / ${s||'WORKSPACE'}</div><h1>${t}</h1></div><span class="pill">● 模拟环境</span></header>`;const btn=(t,fn,cl='')=>`<button class="btn ${cl}" onclick="${fn}">${t}</button>`;function openModal(html){$('#modal').innerHTML=html;$('#modal').showModal()}function closeModal(){$('#modal').close()}function commit(t){save();closeModal();render();toast(t)}
function searchBox(){return `<form class="search" onsubmit="event.preventDefault();query=this.q.value;cat='全部';go('search')">${icon('search')}<input name="q" aria-label="全局搜索" placeholder="搜索全部元件、料号与库位" value="${esc(query)}"><button>搜索</button></form>`}function cabCard(c){let used=c.cells.filter(x=>occupied(x.id).length||x.children.some(y=>occupied(y.id).length)).length;return `<div class="card row partrow" onclick="cabId='${c.id}';cellId='';layer=0;go('cab')"><div class="mini">${'<i></i>'.repeat(16)}</div><div class="grow"><div class="title">${esc(c.name)}</div><small>${c.rows} × ${c.cols} · ${c.layers} 层 · ${used}/${c.cells.length} 格有库存</small><div class="bar"><i style="width:${used/Math.max(1,c.cells.length)*100}%"></i></div></div>${icon('chev')}</div>`}function home(){return header('我的工作室')+searchBox()+`<div class="stats"><div class="stat"><small>元件种类</small><strong>${data.parts.length}</strong></div><div class="stat"><small>库存总量</small><strong>${data.parts.reduce((a,p)=>a+qty(p),0).toLocaleString()}</strong></div></div><section class="hero"><h2>元件入库</h2><p>拍摄包装或手动填写，从识别到上架。</p><div class="actions">${btn(icon('camera')+' 拍照录入',"startEntry('photo')")}${btn(icon('plus')+' 手动录入',"startEntry('manual')")}</div></section><div class="section"><h2>仓储空间</h2>${btn('查看全部',"go('storage')",'soft')}</div>${data.cabs.map(cabCard).join('')}<div class="footnote">所有统计来自当前模拟数据，刷新后保留；不会访问 NAS 或 AI API。</div>`}function partCard(p){return `<div class="card partrow" onclick="showPart('${p.id}')"><div class="row"><div class="part-img">${icon('part')}</div><div class="grow"><div class="title">${esc(p.name)}</div><small>${esc(p.id)} · ${esc(p.mpn||p.category)}</small> ${p.mode==='partial'?'<span class="tag warn">资料不完整</span>':''}</div><strong>${qty(p)} 件</strong></div><div class="line"></div>${Object.entries(p.stock).filter(x=>x[1]>0).map(([l,q])=>`<div class="row spread"><small>${esc(l)}</small><small>${q} 件</small></div>`).join('')||'<small>已建档 · 暂无库存</small>'}</div>`}function listParts(){let q=query.trim().toLowerCase(),arr=data.parts.filter(p=>(cat==='全部'||p.category===cat)&&(!q||[p.name,p.id,p.mpn,...Object.values(p.fields),...Object.keys(p.stock)].join(' ').toLowerCase().includes(q)));return header(route==='search'?'全局搜索':'元件目录','CATALOG')+searchBox()+`<div class="tabs">${['全部','电阻','电容','MCU'].map(x=>`<button class="${cat===x?'on':''}" onclick="cat='${x}';render()">${x}</button>`).join('')}</div><div class="section"><h2>${arr.length} 种元件</h2>${btn('手动录入',"startEntry('manual')",'soft')}</div>${arr.map(partCard).join('')||'<div class="card empty">未找到匹配元件</div>'}`}
function showPart(id){let p=data.parts.find(x=>x.id===id);openModal(`<h2>${esc(p.name)}</h2><small>${p.id} · ${p.mode}</small><div class="line"></div><div class="specs">${Object.entries(p.fields).map(([k,v])=>`<div><small>${esc(k)}</small><strong>${esc(v||'未知')}</strong></div>`).join('')}</div><div class="section"><h2>库存分布</h2></div>${Object.entries(p.stock).map(([l,q])=>`<p>${esc(l)} · ${q} 件</p>`).join('')||'暂无库存'}<div class="line"></div><div class="notice">示例元件未提供真实产品与手册链接；生产版必须保留可信来源。</div><div class="actions">${btn('AI 资料补全（演示）',`closeModal();startEntry('manual','${id}')`)}${btn('追加库存',`closeModal();startEntry('manual','${id}');chooseExisting('${id}')`,'primary')}</div>${btn('关闭','closeModal()')}`)}
function storage(){return header('仓储空间','STORAGE')+`<div class="actions" style="margin-bottom:18px">${btn(icon('plus')+' 新建矩阵',"layoutForm()",'primary')}${btn('导入 / 标准化',"migration()")}</div>${data.cabs.map(cabCard).join('')}<div class="section"><h2>管理工具</h2></div><div class="card row spread"><div><b>批量建库</b><br><small>CSV 草稿与批量元件建档</small></div>${btn('打开','batch()')}</div>`}function cab(){let c=data.cabs.find(x=>x.id===cabId);let x=c.cells.find(x=>x.id===cellId);return header(esc(c.name),'STORAGE')+`<div class="breadcrumb">${btn('← 全部仓储',"go('storage')")} ${btn('扩库 / 补齐','layoutForm(cabId)')}${btn('命名迁移','migration(cabId)')}</div><div class="tabs">${Array.from({length:c.layers},(_,i)=>`<button class="${layer===i?'on':''}" onclick="layer=${i};cellId='';render()">第 ${i+1} 层</button>`).join('')}</div><div class="card"><div class="matrix" style="--cols:${c.cols}">${Array.from({length:c.rows*c.cols},(_,i)=>{let z=c.cells.find(z=>z.l===layer&&z.r===Math.floor(i/c.cols)&&z.c===i%c.cols);return z?`<button class="cell ${occupied(z.id).length||z.children.some(y=>occupied(y.id).length)?'used':''} ${z.id===cellId?'sel':''}" onclick="cellId='${z.id}';render()">${esc(z.displayName||z.id.split('-').slice(1).join('-'))}${z.children.length?`<span class="sub">${z.children.length} 子格</span>`:''}</button>`:`<button class="cell missing" onclick="layoutForm(cabId)">+</button>`}).join('')}</div><small>绿色：有库存　虚线：未建库位　深绿：当前选择</small></div>${x?`<div class="card"><div class="row spread"><div><b>${esc(x.displayName||x.id)}</b><br><small>${x.children.length?'已分隔':'独立抽屉'}</small></div>${btn('编辑分隔','partition()')}</div><div class="line"></div>${(x.children.length?x.children:[x]).map(y=>`<div class="row spread" style="padding:7px 0"><b>${esc(y.id)}</b><small>${occupied(y.id).map(p=>esc(p.name)+' × '+p.stock[y.id]).join('；')||'空闲'}</small></div>`).join('')}</div>`:'<div class="card empty">选择一个抽屉查看库存与布局</div>'}`}
function layoutForm(id){let c=data.cabs.find(x=>x.id===id);openModal(`<h2>${c?'扩库 / 补齐库位':'新建电子元件柜'}</h2><div class="stack"><div class="field"><label>柜子名称</label><input id="cn" value="${esc(c?.name||'电子元件柜 C')}"></div><div class="grid2">${[['行','cr',c?.rows||4],['列','cc',c?.cols||6],['层','cl',c?.layers||1]].map(([t,k,v])=>`<div class="field"><label>${t}数</label><input id="${k}" type="number" min="1" max="20" value="${v}" oninput="layoutPreview('${id||''}')"></div>`).join('')}</div><div id="lp"></div><div class="error" id="le"></div>${btn('确认模拟创建',`applyLayout('${id||''}')`,'primary')}${btn('取消','closeModal()')}</div>`);layoutPreview(id||'')}
function layoutPreview(id){let c=data.cabs.find(x=>x.id===id),r=+$('#cr').value,k=+$('#cc').value,l=+$('#cl').value;$('#lp').innerHTML=`<div class="notice">保留 ${c?.cells.length||0} 个现有库位；预计新增 ${Math.max(0,r*k*l-(c?.cells.length||0))} 个。</div><div class="matrix" style="--cols:${Math.min(k||1,20)}">${Array.from({length:Math.min(400,Math.max(0,r*k))},(_,i)=>`<span class="cell ${c?.cells.some(z=>z.l===0&&z.r===Math.floor(i/k)&&z.c===i%k)?'used':'missing'}" style="display:grid;place-items:center">${i+1}</span>`).join('')}</div>`}
function applyLayout(id){let c=data.cabs.find(x=>x.id===id),r=+$('#cr').value,k=+$('#cc').value,l=+$('#cl').value,name=$('#cn').value.trim();if(!name||![r,k,l].every(n=>Number.isInteger(n)&&n>0&&n<=20)||r*k*l>1000||c&&(r<c.rows||k<c.cols||l<c.layers)){$('#le').textContent='尺寸无效或会删除原库位。';return}if(!c){let cid='C'+Date.now().toString(36);c={id:cid,name,rows:r,cols:k,layers:l,cells:[]};data.cabs.push(c)}let n=c.cells.length;for(let z=0;z<l;z++)for(let y=0;y<r;y++)for(let x=0;x<k;x++)if(!c.cells.some(v=>v.l===z&&v.r===y&&v.c===x)){let key;do{key=c.id+'-'+String(++n).padStart(2,'0')}while(c.cells.some(v=>v.id===key));c.cells.push({id:key,l:z,r:y,c:x,children:[]})}Object.assign(c,{name,rows:r,cols:k,layers:l});cabId=c.id;route='cab';cellId='';commit('布局已保存（模拟）')}
function partition(){let c=data.cabs.find(x=>x.id===cabId).cells.find(x=>x.id===cellId);selection=[];openModal(`<h2>编辑 ${esc(c.id)} 分隔</h2><small>选择新的物理分隔方式。原有库存必须先分配去向。</small><div class="field" style="margin:12px 0"><label>目标子格数量</label><select id="pn" onchange="partPreview()">${[1,2,3,4,6,8].map(n=>`<option value="${n}" ${n===(c.children.length||1)?'selected':''}>${n===1?'合并为单格':n+' 格'}</option>`).join('')}</select></div><div id="pp"></div><div id="moves"></div><div class="error" id="pe"></div>${btn('确认模拟变更','applyPartition()','primary')}${btn('取消','closeModal()')}`);partPreview()}
function partPreview(){let c=data.cabs.find(x=>x.id===cabId).cells.find(x=>x.id===cellId),n=+$('#pn').value,ids=[c.id,...c.children.map(z=>z.id)],ps=data.parts.filter(p=>ids.some(id=>p.stock[id]>0));$('#pp').innerHTML=`<div class="subcells" style="grid-template-columns:repeat(${n>=4?n/2:n},1fr)">${Array.from({length:n},(_,i)=>`<button class="cell">${n===1?c.id:c.id+'-'+(i+1)}</button>`).join('')}</div>`;$('#moves').innerHTML=ps.map(p=>`<div class="field" style="margin-top:8px"><label>${esc(p.name)} · ${ids.reduce((a,id)=>a+(p.stock[id]||0),0)} 件移至</label><select data-part="${p.id}">${Array.from({length:n},(_,i)=>`<option value="${n===1?c.id:c.id+'-'+(i+1)}">${n===1?c.id:c.id+'-'+(i+1)}</option>`).join('')}</select></div>`).join('')}
function applyPartition(){let c=data.cabs.find(x=>x.id===cabId).cells.find(x=>x.id===cellId),n=+$('#pn').value,ids=[c.id,...c.children.map(z=>z.id)],m=[...document.querySelectorAll('#moves select')];if(new Set(m.map(x=>x.value)).size!==m.length){$('#pe').textContent='不同 Part 不得混装在同一最小库位。请先将库存移至其他库位。';return}for(let x of m){let p=data.parts.find(p=>p.id===x.dataset.part),q=ids.reduce((a,id)=>a+(p.stock[id]||0),0);ids.forEach(id=>delete p.stock[id]);p.stock[x.value]=q}c.children=n===1?[]:Array.from({length:n},(_,i)=>({id:c.id+'-'+(i+1)}));commit('分隔已调整（模拟）')}
function migration(id){let c=data.cabs.find(x=>x.id===id)||data.cabs[0];openModal(`<h2>仓储命名迁移</h2><div class="notice">预览原库位与新显示名称；稳定 ID 不变，实际坐标需人工确认。</div><div class="field"><label>新名称前缀</label><input id="mp" value="BOX" oninput="migrationPreview('${c.id}')"></div><div id="mt" class="tablewrap"></div>${btn('保存名称映射（模拟）',`data.cabs.find(x=>x.id==='${c.id}').cells.forEach((x,i)=>x.displayName=$('#mp').value+'-'+String(i+1).padStart(3,'0'));commit('名称映射已保存')`,'primary')}${btn('取消','closeModal()')}`);migrationPreview(c.id)}function migrationPreview(id){let c=data.cabs.find(x=>x.id===id);$('#mt').innerHTML=`<table><tr><th>原 ID</th><th>目标名称</th><th>库存</th></tr>${c.cells.slice(0,30).map((x,i)=>`<tr><td>${esc(x.id)}</td><td>${esc($('#mp').value)}-${String(i+1).padStart(3,'0')}</td><td>${occupied(x.id).length}</td></tr>`).join('')}</table>`}
function batch(){openModal(`<h2>批量建库</h2><div class="notice">演示 CSV 预览：每行名称,分类。正式版需要身份规则、模板和审核。</div><div class="field"><label>CSV 文本</label><textarea id="csv" rows="5">4.7kΩ 电阻,电阻\n22µF 电容,电容</textarea></div><div id="bp"></div>${btn('预览',"$('#bp').textContent=$('#csv').value.split(/\\n/).filter(x=>x.trim()).length+' 条待审核草稿'",'primary')}${btn('关闭','closeModal()')}`)}
function startEntry(mode,id){draft={mode,existing:id||'',name:'',category:'电阻',fields:{},identity:'partial',quantity:100,alloc:{},source:'',datasheet:'',step:0};photoURL='';route='entry';render();if(mode==='photo')$('#photo')?.click()}function chooseExisting(id){draft.existing=id;draft.alloc={};draft.step=2;render()}function entry(){if(!draft)return home();let d=draft,p=data.parts.find(x=>x.id===d.existing);return header('元件入库','RECEIVING')+`<div class="tabs">${['识别 / 检索','资料审核','上架分配','确认'].map((x,i)=>`<button class="${i===d.step?'on':''}" ${i>d.step?'disabled':''} onclick="draft.step=${i};render()">${i+1}. ${x}</button>`).join('')}</div>`+(d.step===0?`<div class="card stack">${d.mode==='photo'?`<div class="field"><label>拍摄或选择照片</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="if(this.files[0]){photoURL=URL.createObjectURL(this.files[0]);render()}"></div>${photoURL?`<img class="preview" src="${photoURL}" alt="实拍照片">`:''}${btn('模拟 AI 识别',"draft.name='10kΩ ±1% 0603 电阻';draft.category='电阻';draft.fields={'阻值':'10 kΩ','容差':'±1%','封装':'0603','功率':'0.1 W'};render()",'soft')}`:''}<div class="field"><label>名称 / MPN / SKU</label><input id="en" value="${esc(d.name)}" oninput="draft.name=this.value;entryMatches()" placeholder="输入 10k 或型号"></div><div id="matches"></div><div class="notice">相似候选不等于身份一致。请核对完整型号或规格；本原型不会自动归并。</div>${btn('新建独立元件',"draft.existing='';draft.step=1;render()",'primary')}</div>`:d.step===1?`<div class="card stack"><div class="field"><label>名称</label><input value="${esc(d.name)}" oninput="draft.name=this.value"></div><div class="field"><label>分类</label><select onchange="draft.category=this.value;draft.fields={};render()">${['电阻','电容','MCU'].map(x=>`<option ${x===d.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>身份类型</label><select onchange="draft.identity=this.value"><option value="partial">部分已知 · 独立存放</option><option disabled>精确型号（生产版需核验）</option><option disabled>通用规格（生产版需批准）</option></select></div><div class="grid2">${(d.category==='电阻'?['阻值','容差','封装','功率','温度系数']:d.category==='电容'?['容值','容差','封装','耐压','介质']:['型号','封装']).map(k=>`<div class="field"><label>${k}</label><input placeholder="未知可留空" value="${esc(d.fields[k])}" oninput="draft.fields['${k}']=this.value"></div>`).join('')}</div><div class="field"><label>供应商来源链接</label><input value="${esc(d.source)}" oninput="draft.source=this.value"></div><div class="field"><label>Datasheet 链接</label><input value="${esc(d.datasheet)}" oninput="draft.datasheet=this.value"></div>${btn('确认资料，选择库位',"if(draft.name.trim()){draft.step=2;render()}else toast('名称必填')",'primary')}</div>`:d.step===2?`<div class="card stack"><b>${esc(p?.name||d.name)}</b><small>${p?'复用已有元件 '+p.id:'新建独立元件'}</small><div class="field"><label>实际入库数量</label><input type="number" min="1" value="${d.quantity}" oninput="draft.quantity=+this.value;allocationStatus()"></div><div id="alloc">${data.cabs.flatMap(c=>c.cells.flatMap(x=>x.children.length?x.children:[x])).filter(x=>occupied(x.id).every(z=>z.id===p?.id)).slice(0,30).map(x=>`<div class="row" style="margin:7px 0"><div class="grow"><b>${esc(x.id)}</b><br><small>${occupied(x.id).length?'已有同种元件':'空闲'} · 容量人工确认</small></div><input aria-label="${esc(x.id)} 数量" type="number" min="0" style="width:85px;padding:9px;border:1px solid var(--line);border-radius:8px" value="${d.alloc[x.id]||0}" oninput="draft.alloc['${x.id}']=+this.value;allocationStatus()"></div>`).join('')}</div><div id="as" class="notice"></div><label><input type="checkbox" id="physical"> 我已确认实际库位容量及实物分配</label>${btn('审核入库',"if(checkAlloc()&&$('#physical').checked){draft.step=3;render()}else toast('检查数量并确认实际容量')",'primary')}</div>`:`<div class="card"><h2>确认入库</h2><b>${esc(p?.name||d.name)}</b><p>入库数量 ${d.quantity} 件</p>${Object.entries(d.alloc).filter(x=>x[1]>0).map(([id,q])=>`<p>${esc(id)} · ${q} 件</p>`).join('')}<div class="notice">本次仅写入浏览器模拟数据。不会调用真实 API。</div>${btn('确认模拟入库','finishEntry()','primary')}</div>`)}
function entryMatches(){let m=$('#matches');if(!m)return;let q=draft.name.toLowerCase().trim();let ps=q?data.parts.filter(p=>[p.name,p.id,p.mpn].join(' ').toLowerCase().includes(q)):[];m.innerHTML=ps.map(p=>`<div class="row card"><div class="grow"><b>${esc(p.name)}</b><br><small>${p.id} · ${qty(p)} 件 · ${p.mode}</small></div>${p.mode==='partial'?'<small>来源未确认，不可归并</small>':btn('确认同一元件',`chooseExisting('${p.id}')`)}</div>`).join('')||(q?'<small>无匹配候选</small>':'')}
function checkAlloc(){let d=draft,arr=Object.entries(d.alloc).filter(x=>x[1]!==0);return Number.isSafeInteger(d.quantity)&&d.quantity>0&&arr.every(([id,q])=>Number.isSafeInteger(q)&&q>0&&data.cabs.some(c=>c.cells.some(x=>x.children.length?x.children.some(y=>y.id===id):x.id===id))&&occupied(id).every(p=>p.id===d.existing))&&arr.reduce((a,x)=>a+x[1],0)===d.quantity}function allocationStatus(){let s=$('#as');if(s)s.textContent='已分配 '+Object.values(draft.alloc).reduce((a,b)=>a+b,0)+' / '+draft.quantity+' 件'+(checkAlloc()?' · 数量一致':' · 请检查分配')}
function finishEntry(){if(!checkAlloc()){toast('分配校验失败');return}let p=data.parts.find(x=>x.id===draft.existing);if(!p){p={id:'NEW-'+Date.now().toString(36),name:draft.name,category:draft.category,mode:'partial',fields:draft.fields,stock:{},source:draft.source,datasheet:draft.datasheet};data.parts.push(p)}for(let [id,q] of Object.entries(draft.alloc))if(q>0)p.stock[id]=(p.stock[id]||0)+q;save();draft=null;go('home');toast('模拟入库完成')}
function settings(){return header('设置','PREFERENCES')+`<div class="card stack"><h3 style="margin:0">库存 Provider</h3><div class="field"><label>库存系统</label><select><option>InvenTree</option></select></div><div class="field"><label>服务 URL（示例配置）</label><input value="${esc(data.settings.url)}" onchange="data.settings.url=this.value;save()" placeholder="http://inventory.home.lan"></div><small>目标版本 1.7.4 · 真实连接未启用</small></div><div class="card stack"><h3 style="margin:0">AI Provider</h3><div class="field"><label>Base URL</label><input value="${esc(data.settings.ai)}" onchange="data.settings.ai=this.value;save()" placeholder="https://gateway.example/v1"></div><div class="field"><label>Model / Agent ID</label><input value="${esc(data.settings.model)}" onchange="data.settings.model=this.value;save()"></div><small>本原型不收集 API Key，不发送网络请求。</small></div><div class="card"><div class="row spread"><div><b>参数模板</b><br><small>LCSC 参考 · 0.2.0 草案</small></div>${btn('查看','templates()')}</div></div><div class="card"><div class="row spread"><div><b>重置模拟数据</b><br><small>不会影响任何外部库存</small></div>${btn('重置',"if(confirm('重置所有模拟数据？')){data=structuredClone(initial);save();render()}")}</div></div>`}function templates(){openModal(`<h2>参数模板 · 草案</h2><p>贴片电阻、陶瓷电容、铝电解电容、固定电感、单管 MOSFET。生产版须以共享 JSON 完整分类冻结为准。</p><div class="notice">默认禁止通用规格自动归并；缺失参数保持未知。</div>${btn('关闭','closeModal()')}`)}
function render(){nav();$('#app').innerHTML=({home,part:listParts,search:listParts,storage,cab,entry,settings}[route]||home)();if(route==='entry'){entryMatches();allocationStatus()}}render();
</script></body></html>
